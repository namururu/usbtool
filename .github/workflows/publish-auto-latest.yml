name: Publish auto-latest update

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check Windows PowerShell 5.1 compatibility
        shell: powershell
        run: .\tests\Test-PasswordCompatibility.ps1

      - name: Build update package
        shell: pwsh
        env:
          PORTABLE_CODEX_RELEASE_TAG: auto-latest
        run: .\Build-UpdateZip.ps1 -WriteManifest

      - name: Build complete Windows x64 package
        shell: pwsh
        run: |
          .\Install-UsbCodex.ps1 -ForceNode -ForceCodex
          .\Install-PythonRuntime.ps1 -Force
          .\Build-UsbCarry.ps1 -CleanOutput -IncludeRuntime -RuntimeArch x64
          Compress-Archive -Path .\usb\portable-codex-usb\* -DestinationPath .\dist\usb.zip -CompressionLevel Optimal -Force
          if (-not (Test-Path .\dist\usb.zip)) { throw "usb.zip was not created." }
          $global:LASTEXITCODE = 0

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "auto-latest"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "auto-latest" --notes "Automatically updated from main."
          }
          gh release upload $tag .\dist\portable-codex-usb.zip .\dist\update.json .\dist\usb.zip --clobber
