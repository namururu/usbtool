<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portable Codex GUI</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark">C</div>
        <div>
          <h1>Portable Codex</h1>
          <p>USB Cockpit</p>
        </div>
      </div>
      <div class="top-status">
        <code id="tokenState">tokens: -</code>
        <code id="sessionState">session: none</code>
        <span class="run-state" id="runState">待機中</span>
      </div>
    </header>

    <details class="settings-panel">
      <summary>設定・状態・履歴</summary>
      <div class="settings-grid">
        <section class="panel">
          <div class="panel-title">状態</div>
          <dl>
            <div>
              <dt>Codex</dt>
              <dd id="codexState">確認中</dd>
            </div>
            <div>
              <dt>CODEX_HOME</dt>
              <dd id="codexHome"></dd>
            </div>
            <div>
              <dt>Root</dt>
              <dd id="rootPath"></dd>
            </div>
            <div>
              <dt>Update</dt>
              <dd id="updateState">未確認</dd>
            </div>
          </dl>
        </section>

        <section class="panel settings-form">
          <div class="panel-title">作業設定</div>
          <div class="field span-2">
            <label for="workspace">作業フォルダ</label>
            <input id="workspace" type="text" autocomplete="off">
          </div>
          <div class="field">
            <label for="model">モデル</label>
            <select id="model">
              <option value="">Codex既定</option>
              <option value="gpt-5.5">gpt-5.5</option>
              <option value="gpt-5.4">gpt-5.4</option>
              <option value="gpt-5.4-mini">gpt-5.4-mini</option>
              <option value="gpt-5.3-codex">gpt-5.3-codex</option>
              <option value="gpt-5.3-codex-spark">gpt-5.3-codex-spark</option>
            </select>
          </div>
          <div class="field">
            <label for="tokenBudget">トークン上限</label>
            <input id="tokenBudget" type="number" min="1" step="1000" placeholder="例: 400000">
          </div>
          <div class="field">
            <label for="permission">権限</label>
            <select id="permission">
              <option value="workspace-write">通常: workspace-write</option>
              <option value="danger-full-access">攻め: danger-full-access</option>
              <option value="bypass">全ツッパリ: bypass approvals/sandbox</option>
              <option value="read-only">読むだけ: read-only</option>
            </select>
          </div>
          <div class="switch-row span-2">
            <label class="switch">
              <input id="resume" type="checkbox" checked>
              <span>同じセッションに続ける</span>
            </label>
            <label class="switch">
              <input id="japanese" type="checkbox" checked>
              <span>初回だけ日本語指示</span>
            </label>
            <label class="switch">
              <input id="autonomous" type="checkbox" checked>
              <span>初回だけ自律指示</span>
            </label>
            <label class="switch danger-switch">
              <input id="bypass" type="checkbox">
              <span>全ツッパリ</span>
            </label>
            <label class="switch">
              <input id="enterToSend" type="checkbox">
              <span>Enterで即送信</span>
            </label>
          </div>
          <div class="field span-2">
            <label for="extraInstruction">毎回足す指示</label>
            <input id="extraInstruction" type="text" value="作業後は変更点と検証結果を簡潔に報告してください。">
          </div>
        </section>

        <section class="panel">
          <div class="panel-title">履歴</div>
          <div id="history" class="history"></div>
        </section>
      </div>
    </details>

    <section class="chat-wrap">
      <div class="chat-head">
        <span>チャット</span>
        <code id="commandPreview"></code>
      </div>
      <div id="terminal" class="terminal"></div>
    </section>

    <section class="composer">
      <div id="attachments" class="attachments"></div>
      <textarea id="prompt" rows="4" placeholder="依頼を書く。画像やファイルはドラッグ&ドロップ、貼り付け、または添付ボタンから追加できます。"></textarea>
      <div class="actions">
        <input id="fileInput" type="file" multiple hidden>
        <button id="attachBtn" type="button">添付</button>
        <button id="screenshotBtn" type="button">スクショ</button>
        <button id="latestImageBtn" type="button">最新画像</button>
        <button id="openImagesBtn" type="button">画像フォルダ</button>
        <button id="openUploadsBtn" type="button">添付フォルダ</button>
        <button id="loginBtn" type="button">ログイン</button>
        <button id="newSessionBtn" type="button">新規セッション</button>
        <button id="clearBtn" type="button">ログ消去</button>
        <button id="stopBtn" type="button" disabled>停止</button>
        <button id="runBtn" type="button" class="primary">送信</button>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
